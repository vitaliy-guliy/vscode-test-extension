schemaVersion: 2.2.0
metadata:
  name: vscode-test-extension
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryRequest: 1G
      memoryLimit: 4G
      cpuRequest: '1'
      cpuLimit: '2'

      env:
        - name: DEFAULT_EXTENSIONS
          value: '/tmp/atlassian.atlascode-3.0.10.vsix;/tmp/snowflake.snowflake-vsc-1.9.1.vsix'

commands:
  - id: install-dependencies
    exec:
      label: 1. Install dependencies
      component: tools
      commandLine: npm install
  - id: compile
    exec:
      label: 2. Compile
      component: tools
      commandLine: npm run compile
      group:
        kind: build
        isDefault: true
  - id: build-vsix
    exec:
      label: 3. Build vsix binary
      component: tools
      commandLine: npm run build-vsix
      group:
        kind: build
        isDefault: false

  - id: add-default-extensions
    exec:
      # put your tooling container name here
      component: tools
      commandLine: |
        # download regular binary
        curl https://open-vsx.org/api/atlassian/atlascode/3.0.10/file/atlassian.atlascode-3.0.10.vsix --location -o /tmp/atlassian.atlascode-3.0.10.vsix
        curl https://open-vsx.org/api/snowflake/snowflake-vsc/1.9.1/file/snowflake.snowflake-vsc-1.9.1.vsix --location -o /tmp/snowflake.snowflake-vsc-1.9.1.vsix

events:
  postStart:
    - add-default-extensions
