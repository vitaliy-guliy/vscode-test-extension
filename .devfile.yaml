schemaVersion: 2.2.0
metadata:
  name: vscode-test-extension

components:

  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryRequest: 1G
      memoryLimit: 4G
      cpuRequest: '1'
      cpuLimit: '2'

  - name: mariadb
    container:
      image: quay.io/eclipse/che--mariadb:10.7.1-5a8009369ee57c85b6f4a08406147bd9c505cde6b8250d16a27d2a5febfdead7
      memoryLimit: 300Mi
      endpoints:
        - exposure: none
          name: db
          protocol: tcp
          targetPort: 3306
      env:
        - name: MARIADB_USER
          value: petclinic
        - name: MARIADB_PASSWORD
          value: petclinic
        - name: MARIADB_DATABASE
          value: petclinic
        - name: MARIADB_ALLOW_EMPTY_ROOT_PASSWORD
          value: allow
        - name: PS1
          value: $(echo ${0}) $
      volumeMounts:
        - name: mysqldata
          path: /var/lib/mysql

  - name: mysqldata
    volume:
      size: 256Mi

commands:

  - id: print-workdir
    exec:
      component: mariadb
      commandLine: |
        pwd && \
        echo "\e[32mDone.\e[0m"

  - id: prepare-database
    exec:
      component: mariadb
      commandLine: |
        mysql -u root < ${PROJECT_SOURCE}/mysql/user.sql && \
        mysql -u root petclinic < ${PROJECT_SOURCE}/mysql/schema.sql && \
        mysql -u root petclinic < ${PROJECT_SOURCE}/mysql/data.sql && \
        echo "\e[32mDone.\e[0m Database petclinic was configured"

  - id: test-sql
    exec:
      component: mariadb
      commandLine: |
        mysql -u root petclinic < ${PROJECT_SOURCE}/mysql/test.sql && \
        echo "\e[32mDone.\e[0m"

  - id: install-dependencies
    exec:
      label: 1. Install dependencies
      component: tools
      commandLine: npm install

  - id: compile
    exec:
      label: 2. Compile
      component: tools
      commandLine: npm run compile
      group:
        kind: build
        isDefault: true

  - id: build-vsix
    exec:
      label: 3. Build vsix binary
      component: tools
      commandLine: npm run build-vsix
      group:
        kind: build
        isDefault: false
